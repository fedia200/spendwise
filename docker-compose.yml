services:
  db:
    image: postgres:16
    container_name: spendwise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendwise_user
      POSTGRES_PASSWORD: spendwise_pass
      POSTGRES_DB: spendwise
    ports:
      - "5432:5432"
    volumes:
      - spendwise-db-data:/var/lib/postgresql/data

volumes:
  spendwise-db-data: